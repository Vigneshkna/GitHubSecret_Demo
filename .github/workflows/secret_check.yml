name: Encode and Print Token

on:
  push:
  workflow_dispatch:

# Set read-only permissions at workflow level
permissions:
  contents: read

jobs:
  encode-token:
    runs-on: ubuntu-latest
    
    steps:
      - name: Encode token to base64 and print
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Encode the token to base64
          ENCODED_TOKEN=$(echo -n "$GITHUB_TOKEN" | base64)
          
          # Print the encoded token
          echo "Base64 Encoded Token:"
          echo "$ENCODED_TOKEN"
          
          # Optional: Decode and print (be careful with this in production)
          echo ""
          echo "Decoded Token (plain text):"
          echo "$ENCODED_TOKEN" | base64 --decode
