name: Encode and Print Token

on:
  push:
  workflow_dispatch:

# Set read-only permissions at workflow level
permissions:
  contents: read

jobs:
  encode-token:
    runs-on: ubuntu-latest
    
    steps:
      - name: Save encoded token to file
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Encode and save to file
          echo -n "$GITHUB_TOKEN" | base64 > token.txt
          
          echo "Base64 token saved to file"
          cat token.txt
          
          # Decode from file
          echo ""
          echo "Decoded from file:"
          cat token.txt | base64 --decode > token_plain.txt
          cat token_plain.txt
