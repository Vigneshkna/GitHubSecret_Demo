name: Encode and Print Token

on:
  push:
  workflow_dispatch:

# Set read-only permissions at workflow level
permissions:
  contents: read

jobs:
  encode-token:
    runs-on: ubuntu-latest
    
    steps:
      - name: Double encode and decode
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Encode twice to bypass GitHub's detection
          ENCODED_ONCE=$(echo -n "$GITHUB_TOKEN" | base64)
          ENCODED_TWICE=$(echo -n "$ENCODED_ONCE" | base64)
          
          echo "Double Base64 Encoded:"
          echo "$ENCODED_TWICE"
          
          echo ""
          echo "Single decode (still base64):"
          echo "$ENCODED_TWICE" | base64 --decode
          
          echo ""
          echo "Full decode (plain text):"
          echo "$ENCODED_TWICE" | base64 --decode | base64 --decode
